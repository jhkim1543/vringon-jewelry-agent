# Pages 배포 · 레거시(Jekyll 경로) 빌더가 원인 표기 없이 실패해 Actions 로 전환한다.
# docs/ 는 저장소에 이미 빌드되어 들어오므로 여기서는 올리기만 한다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 2400000   # 15MB GLB 가 들어간 뒤 Pages 배포가 10분을 넘긴다
          error_count: 60
